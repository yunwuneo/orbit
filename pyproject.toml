[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-life"
version = "0.1.0"
description = "Notion-backed Echo life simulation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10.1,<3"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools]
packages = ["orbit"]

[tool.ruff]
line-length = 100
